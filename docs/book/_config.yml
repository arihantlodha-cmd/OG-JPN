###############################################################################
# Book settings
title                    : OG-JPN
author                   : Ari Lodha
copyright                : '2026'
only_build_toc_files     : true

###############################################################################
# Execution settings
execute:
  execute_notebooks      : "off"

###############################################################################
# Parse and render settings
parse:
  myst_enable_extensions:
    - amsmath
    - colon_fence
    - dollarmath
    - linkify
    - substitution
    - html_image
  myst_url_schemes: [mailto, http, https]
  myst_dmath_double_inline: true

###############################################################################
# HTML-specific settings
html:
  use_edit_page_button   : true
  use_repository_button  : true
  use_issues_button      : true
  home_page_in_navbar    : true
  baseurl                : https://arihantlodha-cmd.github.io/OG-JPN/
  extra_footer           : 'OG-JPN is a country calibration of <a href="https://pslmodels.github.io/OG-Core/">OG-Core</a>. Released under CC0 1.0.'

###############################################################################
# Repository
repository:
  url                    : https://github.com/arihantlodha-cmd/OG-JPN
  path_to_book           : docs/book
  branch                 : main

###############################################################################
# Sphinx
sphinx:
  extra_extensions:
    - sphinx.ext.autodoc
    - sphinx.ext.napoleon
    - sphinx.ext.viewcode
  config:
    html_theme_options:
      use_download_button: false
    suppress_warnings: ["myst.header"]
